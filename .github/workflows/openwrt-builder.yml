#
# OpenWrt Builder + ophub N1 image pack
#

name: OpenWrt Builder

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: "选择N1打包内核（ophub kernel）"
        required: true
        default: "6.1.y"
        type: choice
        options:
          - 5.15.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
          - 6.18.y


env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config

  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true

  TZ: Asia/Shanghai


jobs:

  build:

    permissions:
      contents: write

    runs-on: ubuntu-24.04


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 不删除 /etc/apt/sources.list.d，避免 Ubuntu Runner 软件源丢失
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL

        sudo docker image prune --all --force

        sudo apt-get update

        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
        ack antlr3 asciidoc autoconf automake autopoint \
        binutils bison build-essential bzip2 ccache cmake \
        cpio curl device-tree-compiler fastjar flex gawk gettext \
        gcc-multilib g++-multilib git gperf haveged help2man \
        intltool libc6-dev-i386 libelf-dev libfuse-dev \
        libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
        libmpfr-dev libncurses5-dev libncursesw5-dev \
        libpython3-dev libreadline-dev libssl-dev libtool \
        lrzsz mkisofs msmtp ninja-build p7zip p7zip-full \
        patch pkgconf python3 python3-pyelftools \
        python3-setuptools qemu-utils rsync scons \
        squashfs-tools subversion swig texinfo uglifyjs \
        upx-ucl unzip vim wget xmlto xxd zlib1g-dev


        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean


        sudo timedatectl set-timezone "$TZ"


        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir



    - name: Clone source code
      working-directory: /workdir
      run: |

        df -hT $PWD

        git clone $REPO_URL \
        -b $REPO_BRANCH \
        openwrt

        ln -sf /workdir/openwrt \
        $GITHUB_WORKSPACE/openwrt



    - name: Load custom feeds
      run: |

        [ -e $FEEDS_CONF ] && \
        mv $FEEDS_CONF openwrt/feeds.conf.default


        chmod +x $DIY_P1_SH


        cd openwrt


        $GITHUB_WORKSPACE/$DIY_P1_SH



    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a



    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a



    - name: Load custom configuration
      run: |

        [ -e files ] && \
        mv files openwrt/files


        [ -e $CONFIG_FILE ] && \
        mv $CONFIG_FILE openwrt/.config


        chmod +x $DIY_P2_SH


        cd openwrt


        $GITHUB_WORKSPACE/$DIY_P2_SH



    - name: Download package
      id: package
      run: |

        cd openwrt

        make defconfig

        make download -j8

        find dl -size -1024c -exec ls -l {} \;

        find dl -size -1024c -exec rm -f {} \;

    - name: Compile firmware
      id: compile
      run: |

        cd openwrt


        echo "=========================="
        echo "开始编译 LEDE"
        echo "=========================="


        make -j$(nproc) V=s


        echo "status=success" >> $GITHUB_OUTPUT



    - name: Check firmware
      run: |

        cd openwrt/bin/targets/amlogic/mesongx/


        ls -lh



    # ===============================
    # ophub N1 打包
    # ===============================

    - name: Build Phicomm N1 image with ophub
      if: steps.compile.outputs.status == 'success'
      run: |

        echo "=========================="
        echo "开始 ophub N1 打包"
        echo "Kernel:"
        echo "${{ inputs.kernel }}"
        echo "=========================="


        cd /workdir


        git clone --depth=1 https://github.com/ophub/amlogic-s9xxx-openwrt.git ophub



        mkdir -p /workdir/ophub/openwrt-armsr



        ROOTFS=$(find \
        /workdir/openwrt/bin/targets \
        -name "*rootfs.tar.gz" \
        | head -1)



        echo "找到 rootfs:"
        echo "$ROOTFS"



        cp "$ROOTFS" /workdir/ophub/openwrt-armsr/openwrt-armvirt-64-default-rootfs.tar.gz



        cd /workdir/ophub



        chmod +x remake



        sudo ./remake -b s905d -k ${{ inputs.kernel }}



        mkdir -p /workdir/n1-output



        find /workdir/ophub \
        -name "*.img.gz" \
        -exec cp {} /workdir/n1-output/ \;



        cd /workdir/n1-output



        DATE=$(date +"%Y%m%d%H%M")



        for i in *.img.gz
        do
          mv "$i" \
          "OpenWrt_N1_LEDE_${{ inputs.kernel }}_${DATE}.img.gz"
        done




    # ===============================
    # 整理原始编译文件
    # ===============================


    - name: Organize firmware
      run: |

        cd openwrt/bin/targets/amlogic/mesongx/


        echo "=========================="
        echo "原始 LEDE 输出"
        echo "=========================="


        ls -lh



        DATE=$(date +"%Y%m%d%H%M")



        zip -r \
        OpenWrt_firmware_phicomm_n1_${DATE}.zip \
        .




    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:

        name: OpenWrt_N1_LEDE_${{ inputs.kernel }}

        path: |

          openwrt/bin/targets/amlogic/mesongx/OpenWrt_firmware_phicomm_n1_*.zip

          /workdir/n1-output/*.img.gz

        retention-days: 7

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: N1-${{ inputs.kernel }}-${{ github.run_number }}
        name: OpenWrt N1 ${{ inputs.kernel }}
        body: |
          OpenWrt Phicomm N1 firmware
          Kernel: ${{ inputs.kernel }}
        files: |
          /workdir/n1-output/*.img.gz

